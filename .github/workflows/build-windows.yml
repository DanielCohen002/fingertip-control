name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    paths: ["windows/**", ".github/workflows/build-windows.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r windows/requirements.txt
      - run: pyinstaller --onefile --noconsole --icon assets/icon.ico --add-data "assets/logo.png;assets" --name FingertipControl --collect-submodules comtypes --collect-submodules pycaw windows/fingertip_control_win.py
      - uses: actions/upload-artifact@v4
        with:
          name: FingertipControl-windows
          path: dist/FingertipControl.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/FingertipControl.exe \
            --title "Fingertip Control ${{ github.ref_name }}" \
            --notes "Download FingertipControl.exe below. No install or Python needed. Windows may show a SmartScreen warning because the app is unsigned (click More info, then Run anyway)."
